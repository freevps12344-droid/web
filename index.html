<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Server | Official</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background: radial-gradient(circle at top, #ff004c, #0f0c29);
color:white;
text-align:center;
overflow-x:hidden;
}

header{
padding:60px 20px;
}

h1{
font-size:50px;
text-shadow:0 0 20px #ff4d6d;
}

.server-ip{
margin-top:15px;
display:inline-block;
background:white;
color:#ff004c;
padding:10px 25px;
border-radius:30px;
font-weight:bold;
}

.rank-section{
display:flex;
justify-content:center;
flex-wrap:wrap;
padding:40px 20px;
}

.rank-card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
border-radius:20px;
padding:25px;
margin:20px;
width:260px;
transition:0.4s;
box-shadow:0 0 15px rgba(255,0,76,0.5);
}

.rank-card:hover{
transform:translateY(-10px);
box-shadow:0 0 25px #ff004c;
}

.rank-card h2{
margin-bottom:10px;
}

.price{
margin:10px 0;
font-size:20px;
color:#ff99ac;
}

button{
background:#ff004c;
color:white;
border:none;
padding:10px 25px;
border-radius:25px;
cursor:pointer;
font-weight:bold;
transition:0.3s;
}

button:hover{
background:white;
color:#ff004c;
}

footer{
padding:20px;
margin-top:40px;
background:rgba(0,0,0,0.3);
}

</style>
</head>
<body>

<header>
<h1>💖 Heart Server</h1>
<p>India's Most Powerful Minecraft SMP</p>
<p class="server-ip">IP: play.heartserver.in</p>
</header>

<section class="rank-section">

<div class="rank-card">
<h2>VIP</h2>
<p>Special Tag + Kit</p>
<p class="price">₹99</p>
<button onclick="buyRank('VIP')">Buy Now</button>
</div>

<div class="rank-card">
<h2>MVP</h2>
<p>All VIP + Fly</p>
<p class="price">₹199</p>
<button onclick="buyRank('MVP')">Buy Now</button>
</div>

<div class="rank-card">
<h2>LEGEND</h2>
<p>All Access + Powers</p>
<p class="price">₹299</p>
<button onclick="buyRank('LEGEND')">Buy Now</button>
</div>

<div class="rank-card">
<h2>TITAN</h2>
<p>Special Commands + OP Kit</p>
<p class="price">₹499</p>
<button onclick="buyRank('TITAN')">Buy Now</button>
</div>

<div class="rank-card">
<h2>IMMORTAL</h2>
<p>Ultimate Rank + All Perks</p>
<p class="price">₹799</p>
<button onclick="buyRank('IMMORTAL')">Buy Now</button>
</div>

</section>

<footer>
© 2026 Heart Server | All Rights Reserved
</footer>

<script>
function buyRank(rank){
alert("You selected " + rank + " Rank. Contact Admin to purchase!");
// Yaha payment link add kar sakta hai
// window.location.href="https://yourpaymentlink.com";
}
</script>

</body>
</html>
