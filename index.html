<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Server | Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif;}

body{
background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
text-align:center;
}

/* HERO SECTION */
.hero{
height:90vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background: url('https://images.unsplash.com/photo-1608889175618-3a40c91a1b02') no-repeat center center/cover;
position:relative;
}

.hero::after{
content:'';
position:absolute;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.6);
}

.hero-content{
position:relative;
z-index:1;
}

.hero h1{
font-size:60px;
margin-bottom:20px;
text-shadow:0 0 20px #ff004c;
}

.hero p{
font-size:20px;
margin-bottom:30px;
}

.hero button{
padding:15px 35px;
font-size:18px;
border:none;
border-radius:30px;
background:#ff004c;
color:white;
cursor:pointer;
transition:0.3s;
}

.hero button:hover{
background:white;
color:#ff004c;
}

/* RANK SECTION */
.rank-section{
padding:60px 20px;
display:flex;
justify-content:center;
flex-wrap:wrap;
}

.rank-card{
background:rgba(255,255,255,0.1);
backdrop-filter:blur(12px);
border-radius:20px;
padding:25px;
margin:20px;
width:260px;
transition:0.4s;
box-shadow:0 0 20px rgba(255,0,76,0.4);
}

.rank-card:hover{
transform:translateY(-10px);
box-shadow:0 0 30px #ff004c;
}

.rank-card h2{margin-bottom:10px;}
.price{margin:10px 0;font-size:20px;color:#ff4d6d;}

.rank-card button{
background:#ff004c;
color:white;
border:none;
padding:10px 20px;
border-radius:20px;
cursor:pointer;
}

footer{
padding:20px;
background:#111;
margin-top:40px;
}
</style>
</head>
<body>

<section class="hero">
<div class="hero-content">
<h1>💖 Heart Server</h1>
<p>India's Most Premium Minecraft SMP</p>
<button onclick="alert('Server IP: play.heartserver.in')">JOIN NOW</button>
</div>
</section>

<section class="rank-section">

<div class="rank-card">
<h2>VIP</h2>
<p>Starter Rank + Kit</p>
<p class="price">₹99</p>
<button>Buy</button>
</div>

<div class="rank-card">
<h2>MVP</h2>
<p>VIP + Fly</p>
<p class="price">₹199</p>
<button>Buy</button>
</div>

<div class="rank-card">
<h2>LEGEND</h2>
<p>All Commands</p>
<p class="price">₹299</p>
<button>Buy</button>
</div>

<div class="rank-card">
<h2>TITAN</h2>
<p>OP Kit + Special Power</p>
<p class="price">₹499</p>
<button>Buy</button>
</div>

<div class="rank-card">
<h2>IMMORTAL</h2>
<p>Ultimate Access</p>
<p class="price">₹799</p>
<button>Buy</button>
</div>

<div class="rank-card">
<h2>HEART KING</h2>
<p>Owner Level Perks</p>
<p class="price">₹1499</p>
<button>Buy</button>
</div>

</section>

<footer>
© 2026 Heart Server | Premium Edition
</footer>

</body>
</html>
