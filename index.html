<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Server | Official Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
background: radial-gradient(circle at top,#1a0026,#000000);
color:white;
text-align:center;
}

/* HEADER */
.header{
padding:60px 20px 20px 20px;
}

.header h1{
font-size:55px;
font-weight:800;
color:#ff2e63;
text-shadow:0 0 25px #ff2e63;
}

.server-ip{
margin-top:20px;
display:inline-block;
background:#ff2e63;
padding:15px 40px;
border-radius:40px;
font-size:20px;
font-weight:600;
box-shadow:0 0 20px #ff2e63;
}

/* RANK SECTION */
.rank-section{
margin-top:40px;
display:flex;
justify-content:center;
flex-wrap:wrap;
padding:20px;
}

.rank-card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
backdrop-filter:blur(15px);
border-radius:25px;
padding:30px;
margin:20px;
width:270px;
transition:0.4s;
box-shadow:0 0 15px rgba(255,46,99,0.4);
}

.rank-card:hover{
transform:translateY(-12px);
box-shadow:0 0 35px #ff2e63;
}

.rank-card h2{
margin-bottom:15px;
font-size:22px;
}

.price{
margin:15px 0;
font-size:22px;
color:#ff2e63;
font-weight:600;
}

.rank-card button{
background:#ff2e63;
color:white;
border:none;
padding:12px 25px;
border-radius:25px;
cursor:pointer;
font-weight:600;
transition:0.3s;
}

.rank-card button:hover{
background:white;
color:#ff2e63;
}

footer{
margin-top:50px;
padding:20px;
background:#0a0a0a;
color:#888;
}
</style>
</head>
<body>

<div class="header">
<h1>💖 Heart Server</h1>
<div class="server-ip">IP: play.heartsmp.qzz.io:25655</div>
</div>

<section class="rank-section">

<div class="rank-card">
<h2>VIP</h2>
<p>Starter Perks + Kit</p>
<p class="price">₹99</p>
<button>Buy Now</button>
</div>

<div class="rank-card">
<h2>MVP</h2>
<p>VIP + Fly</p>
<p class="price">₹199</p>
<button>Buy Now</button>
</div>

<div class="rank-card">
<h2>ELITE</h2>
<p>Special Commands</p>
<p class="price">₹299</p>
<button>Buy Now</button>
</div>

<div class="rank-card">
<h2>LEGEND</h2>
<p>All Access + OP Kit</p>
<p class="price">₹499</p>
<button>Buy Now</button>
</div>

<div class="rank-card">
<h2>IMMORTAL</h2>
<p>Ultimate Rank</p>
<p class="price">₹799</p>
<button>Buy Now</button>
</div>

</section>

<footer>
© 2026 Heart Server | Official Store
</footer>

</body>
</html>
